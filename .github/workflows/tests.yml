name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: patzishop_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: patzishop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U patzishop_test -d patzishop_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://patzishop_test:disposable_ci_only@127.0.0.1:5432/patzishop_test
      DATABASE_URL: postgresql://patzishop_test:disposable_ci_only@127.0.0.1:5432/patzishop_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test:migrate
      - run: npm run check
      - run: npm test
      - run: npm run build:backend
      - run: npm run build:frontend
